name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - deploy/github-pages-mirror
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Restore mirror binary assets
        shell: bash
        run: |
          mkdir -p public/media
          cat .mirror-export/hero.b64.part-* | base64 -d > public/media/hero.mp4
          test "$(wc -c < public/media/hero.mp4)" = "$(cat .mirror-export/hero.size)"
          test "$(sha1sum public/media/hero.mp4 | awk '{print $1}')" = "$(cat .mirror-export/hero.sha1)"

      - name: Build static export
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
